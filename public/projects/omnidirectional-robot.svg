    <text x="92" y="386" font-size="68" font-weight="700" letter-spacing="-1">Omnidirectional</text>
    <text x="92" y="462" font-size="68" font-weight="700" letter-spacing="-1" fill="#35d9ff">Robot</text>
    <text x="96" y="522" font-size="20" fill="#9aa2aa" letter-spacing="1">image → direction → wheel vector</text>
  </g>
