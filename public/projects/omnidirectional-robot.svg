<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="AI Omnidirectional Robot project cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1418"/>
      <stop offset="0.6" stop-color="#0b0e11"/>
      <stop offset="1" stop-color="#080a0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#35d9ff" stop-opacity="0.34"/>
      <stop offset="0.65" stop-color="#35d9ff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#35d9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <ellipse cx="890" cy="340" rx="400" ry="340" fill="url(#glow)"/>

  <g opacity="0.5" stroke="#ffffff" stroke-opacity="0.05">
