  <g stroke="#35d9ff" fill="none" stroke-width="1.6">
    <rect x="770" y="250" width="240" height="180" rx="18" stroke-opacity="0.9"/>
    <rect x="806" y="286" width="168" height="108" rx="10" stroke-opacity="0.35"/>
    <circle cx="890" cy="340" r="34" stroke-opacity="0.6"/>
    <circle cx="890" cy="340" r="8" fill="#35d9ff" stroke="none"/>
    <path d="M806 268h-46M940 268h46M806 412h-46M940 412h46" stroke-opacity="0.55"/>
    <path d="M760 268a22 22 0 0 0 0 34M1026 268a22 22 0 0 1 0 34M760 378a22 22 0 0 1 0 34M1026 378a22 22 0 0 0 0 34" stroke-opacity="0.55"/>
